<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8f8ff;background:transparent}.card{padding:14px;border:1px solid #4ccbc4;border-radius:14px;background:#082238}.title{font-weight:800}.detail{font-size:.86rem;color:#c7dbe7;margin:.45rem 0}.buttons{display:flex;gap:8px}button{border:0;border-radius:9px;padding:9px 12px;font:inherit;font-weight:750}#start{background:#58dfc6;color:#04201c}#stop{background:#355166;color:#fff}button:disabled{opacity:.5}
</style></head><body><div class="card"><div class="title" id="status">📍 LIVE LOCATION OFF</div><div class="detail" id="detail">Enable sharing only while you want authorised event facilitators to see this device.</div><div class="buttons"><button id="start">ENABLE LIVE LOCATION</button><button id="stop" disabled>STOP</button></div></div><script>
let watchId=null,intervalMs=20000,lastSent=0,sequence=0;const status=document.getElementById('status'),detail=document.getElementById('detail'),start=document.getElementById('start'),stop=document.getElementById('stop');
function post(type,extra){parent.postMessage(Object.assign({isStreamlitMessage:true,type},extra||{}),'*')}function resize(){post('streamlit:setFrameHeight',{height:document.body.scrollHeight})}function value(v){post('streamlit:setComponentValue',{value:v,dataType:'json'})}function buttons(on){start.disabled=on;stop.disabled=!on}
function halt(label,reason){if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}buttons(false);status.textContent=label;detail.textContent=reason;value({Action:'STOPPED',Status:'UNAVAILABLE'});resize()}
function error(e){const messages={1:'Location permission was denied. Allow location access in your browser settings, then try again.',2:'LOCATION UNAVAILABLE. Move to an open area and check device location services.',3:'LOCATION UNAVAILABLE. Check GPS and network, then try again.'};halt('LOCATION UNAVAILABLE',messages[e.code]||'LOCATION UNAVAILABLE. Try again when location services are available.')}
function position(p){const now=Date.now();status.textContent='📍 LIVE LOCATION ON';detail.textContent='Last update: '+new Date(p.timestamp).toLocaleTimeString()+' · accuracy ±'+Math.round(p.coords.accuracy||0)+' m';if(now-lastSent<intervalMs){resize();return}lastSent=now;sequence++;value({Action:'LOCATION',Status:'CURRENT',Sequence:sequence,latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy_meters:p.coords.accuracy,heading_degrees:p.coords.heading,speed_mps:p.coords.speed,captured_at:new Date(p.timestamp).toISOString()});resize()}
function begin(){if(!navigator.geolocation){halt('LOCATION UNAVAILABLE','This browser does not support location sharing.');return}if(watchId!==null)return;buttons(true);status.textContent='Requesting location permission…';detail.textContent='Choose Allow when your browser asks. Keep this page open; background tracking is not guaranteed.';watchId=navigator.geolocation.watchPosition(position,error,{enableHighAccuracy:true,maximumAge:10000,timeout:30000});resize()}
start.onclick=begin;stop.onclick=()=>halt('📍 LIVE LOCATION OFF','Location sharing has stopped for this event.');window.addEventListener('message',e=>{const m=e.data||{};if(m.type!=='streamlit:render')return;intervalMs=Math.max(15,Math.min(Number((m.args||{}).interval_seconds||20),30))*1000;resize()});post('streamlit:componentReady',{apiVersion:1});resize();
</script></body></html>
